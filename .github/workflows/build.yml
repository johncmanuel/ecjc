name: CI/CD

on:
  push:
    branches:
      - master

permissions:
  packages: write
  contents: read

jobs:
  test:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/server.tests/server.tests.csproj

      - name: Run tests
        run: dotnet test apps/server.tests/server.tests.csproj --no-restore --verbosity normal

  build-and-publish:
    name: Build & Publish Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build Client Image
        run: |
          docker build \
            --build-arg API_URL=http://server:8080 \
            -t ghcr.io/${{ env.OWNER }}/ecjc-client:latest \
            -t ghcr.io/${{ env.OWNER }}/ecjc-client:${{ github.sha }} \
            -f apps/client/Dockerfile .

      - name: Build Server Image
        run: |
          docker build \
            --build-arg ENVIRONMENT=Release \
            -t ghcr.io/${{ env.OWNER }}/ecjc-server:latest \
            -t ghcr.io/${{ env.OWNER }}/ecjc-server:${{ github.sha }} \
            -f apps/server/Dockerfile apps/server

      - name: Push Client Image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/ecjc-client:latest
          docker push ghcr.io/${{ env.OWNER }}/ecjc-client:${{ github.sha }}

      - name: Push Server Image
        run: |
          docker push ghcr.io/${{ env.OWNER }}/ecjc-server:latest
          docker push ghcr.io/${{ env.OWNER }}/ecjc-server:${{ github.sha }}
