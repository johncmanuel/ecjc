name: CI/CD

on:
  push:
    branches:
      - master

permissions:
  packages: write
  contents: read

jobs:
  test:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/server.tests/server.tests.csproj

      - name: Run tests
        run: dotnet test apps/server.tests/server.tests.csproj --no-restore --verbosity normal

  build-and-publish:
    name: Build & Publish Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build Client Image (Cached, No Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=http://ecjc-server:8080
            CENTRIFUGO_URL=http://ecjc-centrifugo:8000
          tags: |
            ghcr.io/${{ env.OWNER }}/ecjc-client:latest
            ghcr.io/${{ env.OWNER }}/ecjc-client:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build Server Image (Cached, No Push)
        uses: docker/build-push-action@v5
        with:
          context: apps/server
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENVIRONMENT=Release
          tags: |
            ghcr.io/${{ env.OWNER }}/ecjc-server:latest
            ghcr.io/${{ env.OWNER }}/ecjc-server:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      # only push once both images build successfully

      - name: Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/client/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=http://ecjc-server:8080
            CENTRIFUGO_URL=http://ecjc-centrifugo:8000
          tags: |
            ghcr.io/${{ env.OWNER }}/ecjc-client:latest
            ghcr.io/${{ env.OWNER }}/ecjc-client:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=client

      - name: Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: apps/server
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENVIRONMENT=Release
          tags: |
            ghcr.io/${{ env.OWNER }}/ecjc-server:latest
            ghcr.io/${{ env.OWNER }}/ecjc-server:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=server
